<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- М'яка тінь для об'єму стікера -->
    <filter id="sticker-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Фон стікера з легким нахилом у стилі Miro -->
  <g transform="rotate(-4 32 32)">
    <!-- Тіло стікера -->
    <rect 
      x="8" 
      y="8" 
      width="48" 
      height="48" 
      rx="8" 
      fill="#FFD02F" 
      filter="url(#sticker-shadow)"
    />

    <!-- Лінії зв'язків (edges) між нодами у формі "M" -->
    <path 
      d="M20 42 L20 23 L32 33 L44 23 L44 42" 
      stroke="#1E293B" 
      stroke-width="3.5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Вузли (nodes) на вершинах літери M -->
    <circle cx="20" cy="23" r="3.2" fill="#3B82F6" stroke="#1E293B" stroke-width="1.8" />
    <circle cx="32" cy="33" r="3.2" fill="#3B82F6" stroke="#1E293B" stroke-width="1.8" />
    <circle cx="44" cy="23" r="3.2" fill="#3B82F6" stroke="#1E293B" stroke-width="1.8" />
  </g>
</svg>
